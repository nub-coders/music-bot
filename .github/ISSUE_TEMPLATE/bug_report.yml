name: Bug Report
description: Report a bug or issue with the bot
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this issue. Please fill out the form below with as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of what the bug is
      placeholder: The bot crashes when I try to play a YouTube video
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Send /play command with a YouTube URL
        2. Bot responds with "Processing..."
        3. Bot crashes with error message
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen?
      placeholder: Bot should start playing the audio in the voice chat
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happens?
      placeholder: Bot crashes with "FFmpeg not found" error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error Logs
      description: If applicable, paste any error messages or logs here
      render: shell

  - type: input
    id: python
    attributes:
      label: Python Version
      placeholder: "3.10.5"

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment Method
      options:
        - Local
        - Heroku
        - Docker
        - VPS
        - Other

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other relevant information
