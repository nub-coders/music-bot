name: Feature Request
description: Suggest a new feature or enhancement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! Please describe your idea below.

  - type: textarea
    id: feature
    attributes:
      label: Feature Description
      description: What feature or enhancement would you like to see?
      placeholder: Add support for Spotify playlist playback
    validations:
      required: true

  - type: textarea
    id: usecase
    attributes:
      label: Use Case
      description: How would this feature help you or other users?
      placeholder: Many users share Spotify playlists in groups and want to play them without manual conversion
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How do you think this should work?
      placeholder: |
        When a user sends /play with a Spotify playlist link, the bot:
        1. Extracts track list via Spotify API
        2. Searches each track on YouTube
        3. Queues all found tracks

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Are there other ways to accomplish this?

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other relevant details, mockups, or examples
